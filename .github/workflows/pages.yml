name: Deploy OURS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p _site
          cp index.html styles.css third-pass.css life-tools.css app-shell.css liquid-dock.css together-plus.css cloud-sync.css app.js config.js cloud-config.js robots.txt .nojekyll manifest.webmanifest service-worker.js menu-extra.js store.js profile.js features.js second-pass.js third-pass.js life-tools.js liquid-dock.js app-shell.js together-plus.js cloud-sync.js _site/
          cp -R assets _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4